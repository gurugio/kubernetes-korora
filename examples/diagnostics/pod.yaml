apiVersion: v1
kind: Pod
metadata:
  name: diagnostics
  namespace: korora
  labels:
    app: diagnostics
    app.kubernetes.io/part-of: korora
spec:
  serviceAccountName: korora
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
  - name: diagnostics
    image: postgres:17.6-alpine
    command:
    - sh
    - -ec
    args:
    - sleep 86400
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
