apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels:
    app: ingest
    app.kubernetes.io/part-of: korora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
        app.kubernetes.io/part-of: korora
    spec:
      serviceAccountName: korora
      automountServiceAccountToken: false
      containers:
      - name: ingest
        image: mendhak/http-https-echo:37
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        env:
        - name: HTTP_PORT
          value: '8080'
        - name: HTTPS_PORT
          value: '8443'
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  labels:
    app: ingest
    app.kubernetes.io/part-of: korora
spec:
  selector:
    app: ingest
  ports:
  - name: http
    port: 80
    targetPort: http
---
