apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres-credentials
    app.kubernetes.io/part-of: korora
type: Opaque
stringData:
  POSTGRES_DB: korora
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: korora-local-admin
  WRITER_PASSWORD: korora-local-writer
  READER_PASSWORD: korora-local-reader
  INGEST_DB_URI: postgresql://korora_writer:korora-local-writer@postgres:5432/korora
  QUERY_DB_URI: postgresql://korora_reader:korora-local-reader@postgres:5432/korora
