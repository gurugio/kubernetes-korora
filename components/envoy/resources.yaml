apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  labels:
    app: envoy
    app.kubernetes.io/part-of: korora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
        app.kubernetes.io/part-of: korora
    spec:
      serviceAccountName: korora
      automountServiceAccountToken: false
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.36.2
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --concurrency
        - '1'
        - --log-level
        - info
        ports:
        - name: http
          containerPort: 10000
        - name: admin
          containerPort: 9901
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 384Mi
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ready
            port: admin
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
  minReadySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  labels:
    app: envoy
    app.kubernetes.io/part-of: korora
spec:
  selector:
    app: envoy
  ports:
  - name: http
    port: 80
    targetPort: http
