admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
static_resources:
  listeners:
  - name: http
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: korora
          use_remote_address: true
          xff_num_trusted_hops: 1
          generate_request_id: true
          preserve_external_request_id: false
          route_config:
            name: korora
            virtual_hosts:
            - name: korora
              domains:
              - '*'
              routes:
              - match:
                  path: /envoy-health
                direct_response:
                  status: 200
                  body:
                    inline_string: 'envoy ok

                      '
              - match:
                  path: /healthz
                route:
                  cluster: web
                  timeout: 2s
              - match:
                  prefix: /ingest/
                route:
                  cluster: ingest
                  prefix_rewrite: /
                  timeout: 5s
              - match:
                  prefix: /query/
                route:
                  cluster: query
                  prefix_rewrite: /
                  timeout: 5s
              - match:
                  prefix: /debug/
                route:
                  cluster: echo
                  prefix_rewrite: /
                  timeout: 5s
              - match:
                  prefix: /
                route:
                  cluster: web
                  timeout: 5s
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  request_id: '%REQ(X-REQUEST-ID)%'
                  method: '%REQ(:METHOD)%'
                  path: '%REQ(:PATH)%'
                  authority: '%REQ(:AUTHORITY)%'
                  status: '%RESPONSE_CODE%'
                  flags: '%RESPONSE_FLAGS%'
                  upstream: '%UPSTREAM_HOST%'
                  duration_ms: '%DURATION%'
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: web
    type: STRICT_DNS
    connect_timeout: 1s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: web
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: web.korora.svc.cluster.local
                port_value: 80
  - name: echo
    type: STRICT_DNS
    connect_timeout: 1s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: echo
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: echo.korora.svc.cluster.local
                port_value: 80
  - name: ingest
    type: STRICT_DNS
    connect_timeout: 1s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: ingest
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ingest.korora.svc.cluster.local
                port_value: 80
  - name: query
    type: STRICT_DNS
    connect_timeout: 1s
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: query
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: query.korora.svc.cluster.local
                port_value: 80
