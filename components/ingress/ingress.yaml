apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: korora
  labels:
    app: korora
    app.kubernetes.io/part-of: korora
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - korora.test
    secretName: korora-tls
  rules:
  - host: korora.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
