apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: korora
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  labels:
    app: echo
    app.kubernetes.io/part-of: korora
spec:
  selector:
    app: echo
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: echo-nodeport
  labels:
    app: echo-nodeport
    app.kubernetes.io/part-of: korora
spec:
  selector:
    app: echo
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: echo-headless
  labels:
    app: echo-headless
    app.kubernetes.io/part-of: korora
spec:
  selector:
    app: echo
  ports:
  - name: http
    port: 8080
    targetPort: http
  clusterIP: None
