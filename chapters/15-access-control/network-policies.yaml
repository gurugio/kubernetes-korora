apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  labels:
    app: allow-prometheus-scrape
    app.kubernetes.io/part-of: korora
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Egress
