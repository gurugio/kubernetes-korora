apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app: default-deny
    app.kubernetes.io/part-of: korora
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    app: allow-dns
    app.kubernetes.io/part-of: korora
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-envoy
  labels:
    app: allow-ingress-envoy
    app.kubernetes.io/part-of: korora
spec:
  podSelector:
    matchLabels:
      app: envoy
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 10000
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9901
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-envoy-upstreams
  labels:
    app: allow-envoy-upstreams
    app.kubernetes.io/part-of: korora
spec:
  podSelector:
    matchLabels:
      app: envoy
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - web
          - echo
          - shadow
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ingest
          - query
    ports:
    - protocol: TCP
      port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-backends
  labels:
    app: allow-http-backends
    app.kubernetes.io/part-of: korora
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - web
      - echo
      - shadow
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: envoy
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  labels:
    app: allow-api-ingress
    app.kubernetes.io/part-of: korora
spec:
  podSelector:
