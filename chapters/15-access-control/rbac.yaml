apiVersion: v1
kind: ServiceAccount
metadata:
  name: korora-reader
  labels:
    app: korora-reader
    app.kubernetes.io/part-of: korora
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: korora-reader
  labels:
    app: korora-reader
    app.kubernetes.io/part-of: korora
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - endpoints
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: korora-reader
  labels:
    app: korora-reader
    app.kubernetes.io/part-of: korora
subjects:
- kind: ServiceAccount
  name: korora-reader
  namespace: korora
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: korora-reader
