apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: korora
servers: 1
agents: 1
image: rancher/k3s:v1.33.6-k3s1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: '6550'
ports:
- port: 127.0.0.1:8080:80
  nodeFilters:
  - loadbalancer
- port: 127.0.0.1:8443:443
  nodeFilters:
  - loadbalancer
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
